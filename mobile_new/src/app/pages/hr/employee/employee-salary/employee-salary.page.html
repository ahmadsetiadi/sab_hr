<ion-header class="ion-no-border">
  <ion-toolbar mode="ios" color="light">
    
    <ion-buttons slot="start">
      <ion-button (click)="onBack()" color="dark">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Employee Salary</ion-title>
    <ion-buttons slot="end">
      <ion-button color="dark" (click)="onSave()" *ngIf="http.user.id_usergroup==1">
        <ion-icon slot="icon-only" name="save-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-row>
    <ion-col size="12">
      <div class="flex items-center bg-gray-700 rounded-md shadow-md p-1 h-10">  
        <ion-icon (click)="prevYear()" class="text-gray-500 text-lg ml-2 text-white" name="chevron-back-outline"></ion-icon>
        <span class="text-sm flex-1 px-1 py-1 text-white text-center">{{selectedYear}}</span>                 
        <ion-icon (click)="nextYear()" *ngIf="currentYear!=selectedYear" class="text-gray-500 text-lg mr-2 text-white" name="chevron-forward-outline">
        </ion-icon>
      </div>
    </ion-col>
  </ion-row>

      <ion-col size="4" class="text-sm">
          <ion-label class="text-sm">Basic Salary</ion-label>
      </ion-col>
      <ion-col size="8" class="text-sm">
          <ion-input 
            [value]="displayValue"

             (ionBlur)="onBlur()"
             (ionInput)="onInput($event)"
            type="text"></ion-input>
      </ion-col>      
  </ion-item>
